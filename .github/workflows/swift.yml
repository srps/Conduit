# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift build -v
    - name: Run tests
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift test -v
    - name: Install script argument parsing
      run: bash ./scripts/test-install-helper-args.sh
    - name: Signing identity script keeps the key secret
      run: bash ./scripts/test-create-signing-identity.sh
    - name: Security boundary regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" observable-target-redaction
        python3 scripts/test-observable-target-redaction.py "$conduit_bin_dir/pm-proxy"
        "$conduit_bin_dir/pm-sim" security-boundaries
        "$conduit_bin_dir/pm-sim" connect-early-direct
        "$conduit_bin_dir/pm-sim" connect-early-upstream
        "$conduit_bin_dir/pm-sim" server-first-connect
        "$conduit_bin_dir/pm-sim" server-first-socks5
        python3 scripts/test-security-boundaries.py "$conduit_bin_dir/pm-proxy"
    - name: Perf gate
      run: bash ./scripts/perf-gate.sh
    - name: Simulator outcomes and full scenario suite
      timeout-minutes: 10
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        python3 scripts/test-sim-outcomes.py "$conduit_bin_dir/pm-sim"
        "$conduit_bin_dir/pm-sim" all
    - name: HTTP request-target preservation
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        python3 scripts/test-http-wire-target.py "$conduit_bin_dir/pm-proxy"
    - name: Forced routing regression
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" forced-proxy-precedence
        "$conduit_bin_dir/pm-sim" pac-unsupported-only
        "$conduit_bin_dir/pm-sim" strict-direct-reachable
    - name: Resource bounds and standalone shutdown regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" shared-inbound-budget
        "$conduit_bin_dir/pm-sim" pac-fetch-bounds
        "$conduit_bin_dir/pm-sim" bounded-writers
        python3 scripts/test-dns-shutdown.py "$conduit_bin_dir/pm-dns"
        python3 scripts/test-status-stream.py "$conduit_bin_dir/pm-proxy"
