# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Fail on NIO threading and lifecycle misuse, including subprocesses.
  SWIFTNIO_STRICT: "1"

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history, so the decision-record check can see that no record
        # was deleted and no ID reused.
        fetch-depth: 0
    - name: Build
      # A clean build takes about three minutes; a compiler that stops
      # making progress would otherwise hold the runner for six hours.
      timeout-minutes: 30
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift build -v
    - name: Kernel import and process fence
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        python3 scripts/check-kernel-imports.py
        python3 scripts/test-kernel-imports.py
    - name: Third-party license notices
      run: |
        python3 scripts/check-third-party-notices.py
        python3 scripts/test-third-party-notices.py
    - name: Event catalogue
      run: |
        python3 scripts/check-event-catalogue.py
        python3 scripts/test-event-catalogue.py
    - name: Decision records
      run: |
        python3 scripts/check-decisions.py --require-history
        python3 scripts/test-decisions.py
    - name: Run tests
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift test -v
    - name: App entry sequencing (stand-in modules, child processes)
      timeout-minutes: 15
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: python3 scripts/test-app-entry.py
    - name: Kerberos worker entry points
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        python3 scripts/test-kerberos-worker.py "$conduit_bin_dir/Conduit" "$conduit_bin_dir/ConduitDaemon"
    - name: Install script argument parsing
      run: bash ./scripts/test-install-helper-args.sh
    - name: Dev bundle packaging (stand-in tools, nothing signed or installed)
      run: bash ./scripts/test-dev-bundle.sh
    - name: Signing identity script keeps the key secret
      run: bash ./scripts/test-create-signing-identity.sh
    - name: Self-update end to end (stand-in host, local feed)
      timeout-minutes: 10
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        zsh ./scripts/test-updater-e2e.sh
        # Release-style signing: hardened runtime everywhere, library
        # validation off for the updater only.
        zsh ./scripts/test-updater-e2e.sh --signed
    - name: Release identity script keeps the keys secret
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: bash ./scripts/test-create-release-identity.sh
    - name: Update feed release notes render
      run: python3 scripts/test-appcast-notes.py
    - name: Security boundary regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" observable-target-redaction
        python3 scripts/test-observable-target-redaction.py "$conduit_bin_dir/pm-proxy"
        "$conduit_bin_dir/pm-sim" security-boundaries
        "$conduit_bin_dir/pm-sim" gateway-probe-blocklist
        "$conduit_bin_dir/pm-sim" connect-early-direct
        "$conduit_bin_dir/pm-sim" connect-early-upstream
        "$conduit_bin_dir/pm-sim" server-first-connect
        "$conduit_bin_dir/pm-sim" server-first-socks5
        python3 scripts/test-security-boundaries.py "$conduit_bin_dir/pm-proxy"
    - name: Perf gate
      run: bash ./scripts/perf-gate.sh
    - name: Simulator outcomes and full scenario suite
      timeout-minutes: 10
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        python3 scripts/test-sim-outcomes.py "$conduit_bin_dir/pm-sim"
        "$conduit_bin_dir/pm-sim" all
    - name: HTTP request-target preservation
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        python3 scripts/test-http-wire-target.py "$conduit_bin_dir/pm-proxy"
    - name: Forced routing regression
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" forced-proxy-precedence
        "$conduit_bin_dir/pm-sim" pac-unsupported-only
        "$conduit_bin_dir/pm-sim" strict-direct-reachable
    - name: Resource bounds and standalone shutdown regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" shared-inbound-budget
        "$conduit_bin_dir/pm-sim" pac-fetch-bounds
        "$conduit_bin_dir/pm-sim" bounded-writers
        python3 scripts/test-dns-shutdown.py "$conduit_bin_dir/pm-dns"
        python3 scripts/test-status-stream.py "$conduit_bin_dir/pm-proxy"
