# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift build -v
    - name: Run tests
      run: DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun swift test -v
    - name: Security boundary regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" observable-target-redaction
        python3 scripts/test-observable-target-redaction.py "$conduit_bin_dir/pm-proxy"
        "$conduit_bin_dir/pm-sim" security-boundaries
        python3 scripts/test-security-boundaries.py "$conduit_bin_dir/pm-proxy"
    - name: Perf gate
      run: bash ./scripts/perf-gate.sh
    - name: Forced routing regression
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" forced-proxy-precedence
    - name: Resource bounds and standalone shutdown regressions
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      run: |
        conduit_bin_dir="$(xcrun swift build --show-bin-path)"
        "$conduit_bin_dir/pm-sim" shared-inbound-budget
        "$conduit_bin_dir/pm-sim" pac-fetch-bounds
        "$conduit_bin_dir/pm-sim" bounded-writers
        python3 scripts/test-dns-shutdown.py "$conduit_bin_dir/pm-dns"
