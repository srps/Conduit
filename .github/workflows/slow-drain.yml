name: Slow-drain regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/slow-drain.yml"
      - "Sources/pm-sim/FakeClient.swift"
      - "Sources/pm-sim/FakeOrigin.swift"
      - "Sources/pm-sim/FakeUpstreamProxy.swift"
      - "Sources/pm-sim/Scenarios.swift"
      - "Sources/ProxyKernel/Proxy/CONNECTHandler.swift"
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - run: xcrun swift build --product pm-sim
      - name: Repeat isolated slow-drain scenario
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$(xcrun swift build --show-bin-path)"
          failures=0
          for iteration in {1..10}; do
            echo "Slow-drain iteration $iteration"
            "$bin_dir/pm-sim" flood-slow-drain --verbose || failures=$((failures + 1))
          done
          test "$failures" = 0
